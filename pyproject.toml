[project]
name = "tbuild"
version = "0.1.0"
description = "Cross-platform project scaffolding tool"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
tbuild = "tbuild.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbuild"]

[tool.uv.workspace]
members = [
    "scratch/demo_py",
]

